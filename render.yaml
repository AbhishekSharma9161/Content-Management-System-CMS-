services:
  # Backend API Service
  - type: web
    name: laravel-cms-backend
    runtime: docker
    repo: https://github.com/AbhishekSharma9161/Content-Management-System-CMS-.git
    region: frankfurt
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: Laravel CMS
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: laravel-cms-db
          property: connectionString
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_DRIVER
        value: file
      - key: SANCTUM_STATEFUL_DOMAINS
        value: "*"
    buildCommand: composer install --no-dev --optimize-autoloader
    startCommand: php artisan migrate --force --seed && php artisan storage:link && php artisan serve --host=0.0.0.0 --port=$PORT

databases:
  - name: laravel-cms-db
    databaseName: laravel_cms
    user: laravel_user
    plan: free
    region: frankfurt
